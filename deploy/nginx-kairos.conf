# /etc/nginx/conf.d/kairos.conf
server {
    listen 80;
    server_name _;  # 有域名后替换为你的域名

    root /var/www/kairos;
    index index.html;

    # react-router 的 history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物可以长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;
}
