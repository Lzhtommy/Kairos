# /etc/nginx/conf.d/kairos.conf
server {
    listen 80;
    server_name _;  # 有域名后替换为你的域名

    root /var/www/kairos;
    index index.html;

    # 反代后端 API 到本机 Docker 容器（FastAPI，见 docker-compose.yml）
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE（策略工坊流式生成）需要关闭缓冲
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # react-router 的 history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物可以长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;
}
