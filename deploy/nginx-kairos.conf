# /etc/nginx/conf.d/kairos.conf
# 登录/注册接口限流：每 IP 2 请求/秒，突发 5（防密码爆破）
limit_req_zone $binary_remote_addr zone=kairos_auth:10m rate=2r/s;

server {
    server_name kairos.ren www.kairos.ren;

    root /var/www/kairos;
    index index.html;

    server_tokens off;

    # 安全响应头。nginx 的 add_header 不继承：location 里只要出现任何
    # add_header，server 层的这些就全部失效，所以 /assets/ 里要重复关键头。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    # 认证接口单独限流（精确前缀优先于下面的 /api/）
    location /api/auth/ {
        limit_req zone=kairos_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 反代后端 API 到本机 Docker 容器（FastAPI，见 docker-compose.yml）
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE（策略工坊流式生成）需要关闭缓冲
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # react-router 的 history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物可以长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/kairos.ren/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kairos.ren/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.kairos.ren) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = kairos.ren) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name kairos.ren www.kairos.ren;
    return 404; # managed by Certbot
}
