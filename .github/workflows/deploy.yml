name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 不用 npm ci：mac 上生成的 lock 会缺少 linux 平台的 wasm 可选依赖（npm 已知问题）
      - run: npm install --no-audit --no-fund

      - run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync frontend dist to server
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519" \
            dist/ "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/kairos/"

      - name: Rsync backend to server
        run: |
          # --delete keeps the tree clean, but never touch the runtime data dir
          # (SQLite lives on a docker volume, not here, so this is just belt-and-suspenders).
          rsync -az --delete --exclude 'data/' --exclude '.venv/' --exclude '__pycache__/' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            server/ "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/kairos/server/"
          rsync -az \
            -e "ssh -i ~/.ssh/id_ed25519" \
            docker-compose.yml "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/kairos/docker-compose.yml"

      - name: Rebuild & restart backend
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "cd /opt/kairos && \
             JWT_SECRET='${{ secrets.JWT_SECRET }}' \
             DEEPSEEK_API_KEY='${{ secrets.DEEPSEEK_API_KEY }}' \
             docker compose up -d --build && \
             docker image prune -f"
