name: Backfill Factors

# 手动触发：在生产容器里回补历史因子快照（PIT 数据）。
# 幂等——已有快照的日期自动跳过，重复运行无副作用。
on:
  workflow_dispatch:
    inputs:
      days:
        description: "回补最近 N 个交易日"
        default: "500"
        required: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      # 执行体在服务器侧脚本里（停 api → 一次性容器 → 拉回 api），nohup 脱离
      # SSH 会话：长时间无输出时中间链路掐 SSH（上次 Broken pipe 导致 api 没被
      # 拉回）也不影响执行；workflow 只负责拉起和轮询完成标记。
      - name: Kick off detached backfill
        run: |
          ssh -o ServerAliveInterval=30 -i ~/.ssh/id_ed25519 \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "chmod +x /opt/kairos/server/scripts/run_backfill.sh && \
             nohup /opt/kairos/server/scripts/run_backfill.sh ${{ inputs.days }} \
               > /tmp/kairos-backfill.nohup 2>&1 & echo kicked"

      - name: Wait for completion (up to 30 min)
        run: |
          for i in $(seq 1 60); do
            sleep 30
            st=$(ssh -o ServerAliveInterval=30 -i ~/.ssh/id_ed25519 \
              "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
              "cat /tmp/kairos-backfill.done 2>/dev/null" || true)
            if [ -n "$st" ]; then
              echo "backfill exit: $st"
              ssh -i ~/.ssh/id_ed25519 \
                "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
                "grep -v 'HTTP Request' /tmp/kairos-backfill.log | tail -25"
              exit "$st"
            fi
            echo "waiting... ($i/60)"
          done
          echo "30 分钟未完成" >&2
          exit 1

      - name: Verify service healthy after backfill
        if: always()
        run: |
          for i in $(seq 1 20); do
            sleep 10
            curl -sf --max-time 10 "http://${{ secrets.SERVER_HOST }}/api/health/data" && exit 0
          done
          echo "api 未在 200 秒内恢复" >&2
          exit 1
