name: Backfill

# 手动触发：在生产容器里回补历史数据。幂等，重复运行无副作用。
# - factors: 回补最近 N 个交易日的因子快照（PIT 数据），value = 天数
# - kline:   日 K 深度回补到 N 根（约 5 年 = 1250，断点续跑），value = 根数
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "回补类型（kline-full=整段 qfq 重刷，修复除权台阶）"
        type: choice
        options: [factors, kline, kline-full]
        default: "factors"
        required: true
      value:
        description: "factors=交易日数 / kline=目标根数"
        default: "500"
        required: true
      timeoutMinutes:
        description: "最长等待分钟数（kline 全量约需 180+）"
        default: "60"
        required: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      # 执行体在服务器侧脚本里（停 api → 一次性容器 → 拉回 api），nohup 脱离
      # SSH 会话：长时间无输出时中间链路掐 SSH（上次 Broken pipe 导致 api 没被
      # 拉回）也不影响执行；workflow 只负责拉起和轮询完成标记。
      - name: Kick off detached backfill
        run: |
          ssh -o ServerAliveInterval=30 -i ~/.ssh/id_ed25519 \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "chmod +x /opt/kairos/server/scripts/run_backfill.sh && \
             nohup /opt/kairos/server/scripts/run_backfill.sh ${{ inputs.mode }} ${{ inputs.value }} \
               > /tmp/kairos-backfill.nohup 2>&1 & echo kicked"

      - name: Wait for completion
        run: |
          loops=$(( ${{ inputs.timeoutMinutes }} * 2 ))
          for i in $(seq 1 "$loops"); do
            sleep 30
            st=$(ssh -o ServerAliveInterval=30 -i ~/.ssh/id_ed25519 \
              "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
              "cat /tmp/kairos-backfill.done 2>/dev/null" || true)
            if [ -n "$st" ]; then
              echo "backfill exit: $st"
              ssh -i ~/.ssh/id_ed25519 \
                "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
                "grep -v 'HTTP Request' /tmp/kairos-backfill.log | tail -25"
              exit "$st"
            fi
            echo "waiting... ($i/$loops)"
          done
          echo "${{ inputs.timeoutMinutes }} 分钟未完成（服务器侧仍在跑，可稍后重触发 kline 断点续跑）" >&2
          exit 1

      - name: Verify service healthy after backfill
        if: always()
        run: |
          for i in $(seq 1 20); do
            sleep 10
            curl -sf --max-time 10 "http://${{ secrets.SERVER_HOST }}/api/health/data" && exit 0
          done
          echo "api 未在 200 秒内恢复" >&2
          exit 1
