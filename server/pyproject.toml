# 只用于打包发布独立的采集包 kairos-data（server/kairos_data/）。
# Kairos 后端本身仍按 requirements.txt 安装，不走这里。
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kairos-data"
dynamic = ["version"]
description = "A 股公开数据采集入库：股票池（含退市股）、日 K、财报、分红、指数成分、宏观利率、公告"
readme = "kairos_data/README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["sqlalchemy>=2.0", "httpx>=0.27"]

[project.optional-dependencies]
baostock = ["baostock>=0.9.4"]
mysql = ["pymysql>=1.1"]
all = ["baostock>=0.9.4", "pymysql>=1.1"]

[project.scripts]
kairos-data = "kairos_data.cli:main"

[project.urls]
Homepage = "https://github.com/Lzhtommy/Kairos"

[tool.setuptools]
packages = ["kairos_data", "kairos_data.sources"]

[tool.setuptools.dynamic]
version = { attr = "kairos_data.__version__" }
