# MVP backend. The frontend keeps deploying as static files via host Nginx,
# which reverse-proxies /api/ to this container (see deploy/nginx-kairos.conf).
services:
  api:
    build:
      context: ./server
      args:
        # Install the live A-share (AkShare) extras in production.
        WITH_DATA: "true"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # 生产在 /opt/kairos/.env 里设 DATABASE_URL 指向 RDS MySQL；未设时用卷上的 SQLite
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/kairos.db}
      # 迁移目标库（scripts.migrate_sqlite_to_mysql 默认读它），切换完成后可删
      RDS_DATABASE_URL: ${RDS_DATABASE_URL:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PROVIDER: ${PROVIDER:-auto}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://kairos.ren,https://www.kairos.ren}
    volumes:
      - kairos-data:/app/data

volumes:
  kairos-data:
